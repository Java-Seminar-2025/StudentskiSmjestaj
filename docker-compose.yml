version: "3.8"
services:
  db:
    image: postgres:16
    container_name: studentski-smjestaj-db
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student123
      POSTGRES_DB: smjestaj
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
