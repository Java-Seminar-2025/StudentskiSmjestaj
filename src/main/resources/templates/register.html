<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>

<h2>User Registration</h2>

<div th:if="${errorMessage}" style="color: red; font-weight: bold;">
    <p th:text="${errorMessage}"></p>
</div>

<form th:action="@{/user/register}" th:object="${registerData}" method="post">
    <label for="name">Name:</label><br>
    <input type="text" id="name" th:field="*{name}" required><br><br>

    <label for="surname">Surname:</label><br>
    <input type="text" id="surname" th:field="*{surname}" required><br><br>

    <label for="username">Username:</label><br>
    <input type="text" id="username" th:field="*{username}" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" th:field="*{email}" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" th:field="*{password}" required><br><br>

    <label for="confirmPassword">Confirm Password:</label><br>
    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required><br><br>

    <label for="role">Role:</label><br>
    <select id="role" th:field="*{role}">
        <option value="STUDENT">Student</option>
        <option value="LANDLORD">Landlord</option>
        <option value="ADMIN">Admin</option>
    </select><br><br>

    <button type="submit">Register</button>
</form>

</body>
</html>
