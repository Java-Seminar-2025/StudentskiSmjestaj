<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>

<body>
    <div class="card">
        <div class="header">
            <h2>User Registration</h2>
        </div>

        <div class="form_error" th:if="${errorMessage}" style="color: red; font-weight: bold;">
            <span th:text="${errorMessage}"></span>
        </div>

        <form class="form form--single" th:action="@{/user/register}" th:object="${registerData}" method="post">
            <div class="form_field">
                <label for="name">Name:</label>
                <input type="text" id="name" th:field="*{name}" required>
            </div>

            <div class="form_field">
                <label for="surname">Surname:</label>
                <input type="text" id="surname" th:field="*{surname}" required>
            </div>

            <div class="form_field">
                <label for="username">Username:</label>
                <input type="text" id="username" th:field="*{username}" required>
            </div>

            <div class="form_field">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>

            <div class="form_field">
                <label for="phoneNumber">Phone number:</label>
                <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" required>
            </div>

            <div class="form_field">
                <label for="password">Password:</label>
                <input type="password" id="password" th:field="*{password}" required>
            </div>

            <div class="form_field">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
            </div>

            <div class="form_field">
                <label for="role">Role:</label>
                <select id="role" th:field="*{role}">
                    <option value="STUDENT">Student</option>
                    <option value="LANDLORD">Landlord</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
