<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book a room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
<div class="page_header">
    <h2>Book a room</h2>
</div>
<div class="page_content">
    <div class="cards-grid" th:object="${bookedRoomsData}">
        <div class="card" th:each="room, stat : ${bookedRoomsData.rooms}">
            <div class="header">
                <h2>Room <span th:text="${stat.count}"></span></h2>
            </div>

            <div class="room_info room_info--first">
                <strong>Price:</strong> €<span th:text="${#numbers.formatDecimal(room.roomPrice, 1, 2)}"></span>
            </div>
            <div class="room_info room_info--last">
                <strong>Capacity:</strong> <span th:text="${room.capacity}"></span>
            </div>
        </div>
    </div>

    <form class="form form--single" id="red_form" th:action="@{/reservations/myReservations}" method="get">
        <button type="submit">Back to my reservations</button>
    </form>
</div>
