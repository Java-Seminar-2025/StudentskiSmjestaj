<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User info</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div class="card" id="userInfo_card">
        <div class="header">
            <h2>User info</h2>
        </div>
        <div><strong>Name:</strong> <span th:text="${userData.name}"></span></div>
        <div><strong>Surname:</strong> <span th:text="${userData.surname}"></span></div>
        <div><strong>Username:</strong> <span th:text="${userData.username}"></span></div>
        <div><strong>Email:</strong> <span th:text="${userData.email}"></span></div>
        <div><strong>Phone number:</strong> <span th:text="${userData.phoneNumber}"></span></div>
    </div>
    <div th:if="${userData.role.displayName == 'student'}" class="card" id="studentInfo_card">
        <div class="header" id="green_header">
            <h2>Student info</h2>
        </div>
        <div><strong>Faculty name:</strong> <span th:text="${studentData.facultyName}"></span></div>
        <div><strong>Address:</strong> <span th:text="${studentData.facultyAddress}"></span></div>
        <div><strong>City:</strong> <span th:text="${studentData.facultyCity}"></span></div>
        <div><strong>Year of study:</strong> <span th:text="${studentData.yearOfStudy}"></span></div>
        <div><strong>Gender:</strong> <span th:text="${studentData.gender.displayName}"></span></div>
    </div>
</body>
</html>
