<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/table.css}">
</head>
<body>

<div class="page_header admin_header">
    <h2>User Management</h2>
</div>

<div class="admin_container">
    <div class="admin_card">

        <table class="admin_table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Surname</th>
                <th>Email</th>
                <th>Username</th>
                <th>Role</th>
                <th>Phone</th>
                <th class="change_role">Change role</th>
                <th class="status">Status</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.name}"></td>
                <td th:text="${user.surname}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.role.displayName}"></td>
                <td th:text="${user.phoneNumber}"></td>

                <td class="change_role">
                    <form th:action="@{/admin/changeRole}" method="post">
                        <input type="hidden" name="username" th:value="${user.username}">
                        <select name="role">
                            <option value="STUDENT">Student</option>
                            <option value="LANDLORD">Landlord</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                        <button class="btn green" type="submit">Change</button>
                    </form>
                </td>

                <td class="status">
                    <form th:action="@{/admin/blockOrUnblockUser}" method="post">
                        <input type="hidden" name="username" th:value="${user.username}">
                        <input type="hidden" name="blocked" th:value="${user.blocked}">

                        <button th:if="${!user.blocked}" class="btn red" type="submit">
                            Block
                        </button>

                        <button th:if="${user.blocked}" class="btn blue" type="submit">
                            Unblock
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

</body>

</html>
