<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
<div class="page_header" id="green_header">
    <h2>Reservations</h2>
</div>
<div class="page_content">
    <div class="cards-grid" th:object="${allRoomsData}">
        <div class="card" th:each="room, stat : ${allRoomsData.rooms}">
            <div class="header" id="cyan_header">
                <h2>Room <span th:text="${stat.count}"></span></h2>
            </div>

            <div class="room_info room_info--first">
                <strong>Price:</strong> €<span th:text="${#numbers.formatDecimal(room.roomPrice, 1, 2)}"></span>
            </div>
            <div class="room_info">
                <strong>Capacity:</strong> <span th:text="${room.capacity}"></span>
            </div>

            <div class="student_names" th:each="reservation : ${room.reservations}">
                <a href="studentInfo.html" th:text="${reservation.studentUsername}"></a>

                <form class="form form--single" id="green_form" th:action="@{/reservations/accept}" method="post">
                    <input type="hidden" name="reservationId" th:value="${reservation.reservationId}">
                    <button type="submit">Accept</button>
                </form>
            </div>

        </div>
    </div>
    <form class="form form--single" id="red_form" th:action="@{/listings/myListings}" method="get">
        <button type="submit">Back to my listings</button>
    </form>
</div>
</body>
</html>
