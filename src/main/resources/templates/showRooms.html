<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book a room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
<div class="page_header">
    <h2>Book a room</h2>
</div>
<div class="page_content">
    <div class="cards-grid" th:object="${allRoomsData}">
        <div class="card" th:each="room, stat : ${allRoomsData.rooms}">
            <div class="header">
                <h2>Room <span th:text="${stat.count}"></span></h2>
            </div>

            <div class="room_info room_info--first">
                <strong>Price:</strong> €<span th:text="${#numbers.formatDecimal(room.roomPrice, 1, 2)}"></span>
            </div>
            <div class="room_info">
                <strong>Capacity:</strong> <span th:text="${room.capacity}"></span>
            </div>

            <form class="form form--single" id="green_form" th:action="@{/reservations/add/room}" method="post">
                <input type="hidden" name="roomId" th:value="${room.roomId}">

                <input type="hidden" name="page" th:value="${pageDto.page}">
                <input type="hidden" name="size" th:value="${pageDto.size}">
                <input type="hidden" name="totalPages" th:value="${pageDto.totalPages}">

                <input type="hidden" name="lowerPrice" th:value="${optionsData.lowerPrice}">
                <input type="hidden" name="upperPrice" th:value="${optionsData.upperPrice}">
                <input type="hidden" name="city" th:value="${optionsData.city}">
                <input type="hidden" name="numberOfStudents" th:value="${optionsData.numberOfStudents}">
                <input type="hidden" name="numberOfRooms" th:value="${optionsData.numberOfRooms}">

                <button type="submit" name="action" value="first">Book</button>
            </form>
        </div>
    </div>

    <form class="form form--single" id="purple_form" th:action="@{/reservations/add/full}" method="post">
        <input type="hidden" name="listingId" th:value="${allRoomsData.listingId}">

        <input type="hidden" name="page" th:value="${pageDto.page}">
        <input type="hidden" name="size" th:value="${pageDto.size}">
        <input type="hidden" name="totalPages" th:value="${pageDto.totalPages}">

        <input type="hidden" name="lowerPrice" th:value="${optionsData.lowerPrice}">
        <input type="hidden" name="upperPrice" th:value="${optionsData.upperPrice}">
        <input type="hidden" name="city" th:value="${optionsData.city}">
        <input type="hidden" name="numberOfStudents" th:value="${optionsData.numberOfStudents}">
        <input type="hidden" name="numberOfRooms" th:value="${optionsData.numberOfRooms}">

        <button type="submit" class="full_reservation_btn">Book entire accommodation</button>
    </form>

    <form class="form form--single" id="red_form" th:action="@{/listings/changePage}" method="post">
        <input type="hidden" name="page" th:value="${pageDto.page}">
        <input type="hidden" name="size" th:value="${pageDto.size}">
        <input type="hidden" name="totalPages" th:value="${pageDto.totalPages}">

        <input type="hidden" name="lowerPrice" th:value="${optionsData.lowerPrice}">
        <input type="hidden" name="upperPrice" th:value="${optionsData.upperPrice}">
        <input type="hidden" name="city" th:value="${optionsData.city}">
        <input type="hidden" name="numberOfStudents" th:value="${optionsData.numberOfStudents}">
        <input type="hidden" name="numberOfRooms" th:value="${optionsData.numberOfRooms}">

        <button type="submit" name="action" value="first">
            Back to listings
        </button>
    </form>
</div>
</body>
</html>
