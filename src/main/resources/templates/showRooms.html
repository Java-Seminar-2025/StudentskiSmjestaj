<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book a room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
<div class="page_header">
    <h2>Book a room</h2>
</div>
<div class="page_content">
    <div class="cards-grid" th:object="${allRoomsData}">
        <div class="card" th:each="room, stat : ${allRoomsData.rooms}">
            <div class="header" id="cyan_header">
                <h2>Room <span th:text="${stat.count}"></span></h2>
            </div>

            <div class="room_info room_info--first">
                <strong>Price:</strong> €<span th:text="${#numbers.formatDecimal(room.roomPrice, 1, 2)}"></span>
            </div>
            <div class="room_info">
                <strong>Capacity:</strong> <span th:text="${room.capacity}"></span>
            </div>

            <form class="form form--single" id="green_form" th:action="@{/reservations/add}" method="post">
                <input type="hidden" name="roomId" th:value="${room.roomId}">
                <button type="submit">Book</button>
            </form>
        </div>
    </div>
    <form class="form form--single" id="red_form">
        <button type="submit">Back to listings</button>
    </form>
</div>
</body>
</html>
