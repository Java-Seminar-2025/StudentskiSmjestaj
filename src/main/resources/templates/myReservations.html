<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My reservations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/table.css}">
</head>
<body>

<div class="page_header admin_header">
    <h2>My reservations</h2>
</div>

<div class="admin_container">
    <div class="admin_card">

        <table class="admin_table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Address</th>
                <th>City</th>
                <th>Landlord</th>
                <th>Deadline</th>
                <th>Status</th>
                <th>Type</th>
                <th>Booked rooms</th>
                <th>Listing rooms</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="myReservation : ${listingsWithReservations}">
                <td th:text="${myReservation.title}"></td>
                <td th:text="${myReservation.address}"></td>
                <td th:text="${myReservation.city}"></td>
                <td th:text="${myReservation.landlordUsername}"></td>
                <td th:text="${#temporals.format(myReservation.cancellationDeadline, 'dd.MM.yyyy. HH:mm')}"></td>
                <td th:text="${myReservation.status}"></td>
                <td th:text="${myReservation.type}"></td>
                <td th:text="${myReservation.numberOfBookedRooms}"></td>
                <td th:text="${myReservation.numberOfRooms}"></td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

</body>

</html>
