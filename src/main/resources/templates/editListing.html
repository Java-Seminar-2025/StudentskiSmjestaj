<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit listing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
<div class="card" id="two_columns_card">
    <div class="header" id="purple_header">
        <h2>Edit listing</h2>
    </div>

    <form class="form form--grid" id="purple_form" th:action="@{/listings/edit}" th:object="${listingData}" method="post">
        <div class="form_field">
            <label for="title">Title:</label>
            <input type="text" id="title" th:field="*{title}" required>
        </div>

        <div class="form_field">
            <label for="address">Address:</label>
            <input type="text" id="address" th:field="*{address}" required>
        </div>

        <div class="form_field form_field--span2">
            <label for="description">Description:</label>
            <textarea id="description" th:field="*{description}" rows="5" required></textarea>
        </div>

        <div class="form_field">
            <label for="city">City:</label>
            <input type="text" id="city" th:field="*{city}" required>
        </div>

        <div class="form_field">
            <label for="price">Price:</label>
            <input type="number" id="price" step="0.01" th:field="*{price}" required>
        </div>

        <div class="form_field">
            <label for="numberOfStudents">Number of students:</label>
            <input type="number" id="numberOfStudents" th:field="*{numberOfStudents}" required>
        </div>

        <div class="form_field">
            <label for="numberOfRooms">Number of rooms:</label>
            <input type="number" id="numberOfRooms" th:field="*{numberOfRooms}" required>
        </div>

        <div class="form_field">
            <label for="preferredGender">Preferred gender:</label>
            <select id="preferredGender" th:field="*{preferredGender}">
                <option value="">None</option>
                <option value="MALE">Male</option>
                <option value="FEMALE">Female</option>
            </select>
        </div>

        <div class="form_field">
            <label for="cancellationDeadline">Cancellation deadline:</label>
            <input type="datetime-local" id="cancellationDeadline" th:field="*{cancellationDeadline}">
        </div>

        <input type="hidden" id="listingId" th:field="*{listingId}">
        <input type="hidden" id="landlordUsername" th:field="*{landlordUsername}">
        <input type="hidden" id="deleted" th:field="*{deleted}">

        <button type="submit">Save changes</button>
    </form>
</div>
</body>
</html>
