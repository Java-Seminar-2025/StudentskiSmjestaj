<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div class="card">
        <div class="header" id="auth_header">
            <h2>User Login</h2>
        </div>

        <div class="form_error" th:if="${param.error}" style="color: red; font-weight: bold;">
            Wrong username and/or password!
        </div>

        <form class="form" id="auth_form" th:action="@{/user/login}" th:object="${loginData}" method="post">
            <div class="form_field">
                <label for="username">Username:</label>
                <input type="text" id="username" th:field="*{username}" required>
            </div>
            <div class="form_field">
                <label for="password">Password:</label>
                <input type="password" id="password" th:field="*{password}" required>
            </div>
            <button type="submit">Login</button>
        </form>

        <div class="auth_footer">
            <p>Don't have an account? <a th:href="@{/user/register}">Register here</a></p>
        </div>
    </div>
</body>
</html>
