<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/user.css}">
</head>
<body>
<div class="login_page">
    <h2>User Login</h2>
    <div th:if="${param.error}" style="color: red; font-weight: bold;">
        Wrong username and/or password!
    </div>

    <form th:action="@{/user/login}" th:object="${loginData}" method="post">

        <label for="username">Username:</label><br>
        <input type="text" id="username" th:field="*{username}" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" th:field="*{password}" required><br><br>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a th:href="@{/user/register}">Register here</a></p>
</div>
</body>
</html>
