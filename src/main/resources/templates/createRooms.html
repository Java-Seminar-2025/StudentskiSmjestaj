<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create rooms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div class="page_header">
        <h2>Create rooms</h2>
    </div>

    <form class="form" id="purple_form" th:action="@{/listingRooms/create}" th:object="${allRoomsData}" method="post">
        <input type="hidden" id="listingId" th:field="*{listingId}" />

        <div class="card" th:each="i : ${#numbers.sequence(0, allRoomsData.numberOfRooms - 1)}">
            <div class="header" id="purple_header">
                <h2>Room <span th:text="${i + 1}"></span></h2>
            </div>

            <div class="form_field">
                <label for="roomPrice">Price:</label>
                <input type="number" id="roomPrice" th:field="*{rooms[__${i}__].roomPrice}" required>
            </div>

            <div class="form_field">
                <label for="capacity">Capacity:</label>
                <input type="number" id="capacity" th:field="*{rooms[__${i}__].capacity}" required>
            </div>
        </div>

        <button type="submit">Create rooms</button>
    </form>
</body>
</html>
