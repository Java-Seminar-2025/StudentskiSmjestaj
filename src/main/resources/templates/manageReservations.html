<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage reservations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
<div class="page_header">
    <h2>Manage reservations</h2>
</div>
<div class="page_content">
    <div class="cards-grid" th:object="${allRoomsData}">
        <div class="card" th:each="room, stat : ${allRoomsData.rooms}">
            <div class="header">
                <h2>Room <span th:text="${stat.count}"></span></h2>
            </div>

            <div class="room_info room_info--first">
                <strong>Price:</strong> €<span th:text="${#numbers.formatDecimal(room.roomPrice, 1, 2)}"></span>
            </div>
            <div class="room_info room_info--last">
                <strong>Capacity:</strong> <span th:text="${room.capacity}"></span>
            </div>

            <table class="reservation_table">
                <tr class="reservation" th:each="reservation : ${room.reservations}">
                    <td><a href="studentInfo.html" th:text="${reservation.studentUsername}"></a></td>

                    <td>
                        <form class="form form--single" th:action="@{/reservations/accept}" method="post">
                            <input type="hidden" name="reservationId" th:value="${reservation.reservationId}">
                            <button type="submit" class="accept_btn">Accept</button>
                        </form>
                    </td>
                </tr>
            </table>

        </div>

        <div class="card">
            <div class="header" id="purple_header">
                <h2>Entire accommodation</h2>
            </div>

            <div class="accommodation_info">
                <strong>Price:</strong> €<span th:text="${#numbers.formatDecimal(listingData.price, 1, 2)}"></span>
            </div>

            <table class="reservation_table">
                <tr class="reservation" th:each="reservation : ${fullReservations}">
                    <td><a href="studentInfo.html" th:text="${reservation.studentUsername}"></a></td>

                    <td>
                        <form class="form form--single" th:action="@{/reservations/accept}" method="post">
                            <input type="hidden" name="reservationId" th:value="${reservation.reservationId}">
                            <button type="submit" class="accept_btn">Accept</button>
                        </form>
                    </td>
                </tr>
            </table>
        </div>

    </div>
    <form class="form form--single"
          th:if="${userData.role.displayName == 'landlord'}"
          th:action="@{/listings/myListings}" method="get">
        <button type="submit">Back to my listings</button>
    </form>

    <form class="form form--single"
          th:if="${userData.role.displayName == 'student'}"
          th:action="@{/reservations/myReservations}" method="get">
        <button type="submit">Back to my reservations</button>
    </form>
</div>
</body>
</html>
