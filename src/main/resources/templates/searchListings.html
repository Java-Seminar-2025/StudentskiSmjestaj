<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search listings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div class="card">
        <div class="header" id="green_header">
            <h2>Search filters</h2>
        </div>

        <form class="form form--single" th:object="${listingFilters}">
            <div class="form_field">
                <label for="lowerPrice">Lower price:</label>
                <input type="number" id="lowerPrice" th:field="*{lowerPrice}">
            </div>

            <div class="form_field">
                <label for="upperPrice">Upper price:</label>
                <input type="number" id="upperPrice" th:field="*{upperPrice}">
            </div>

            <div class="form_field">
                <label for="city">City:</label>
                <input type="text" id="city" th:field="*{city}">
            </div>

            <div class="form_field">
                <label for="numberOfStudents">Number of students:</label>
                <input type="number" id="numberOfStudents" th:field="*{numberOfStudents}">
            </div>

            <div class="form_field">
                <label for="numberOfRooms">Number of rooms:</label>
                <input type="number" id="numberOfRooms" th:field="*{numberOfRooms}">
            </div>

            <div>
                <button type="submit" formaction="/listings/filters" formmethod="post" class="search_btn">
                    Search
                </button>
            </div>
            <div>
                <button type="submit" formaction="/home" formmethod="get" class="back_btn">
                    Back to home page
                </button>
            </div>
        </form>
    </div>
</body>
</html>
